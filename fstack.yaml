# fstack v0.1
# Shareable project config. Paths are relative to this file.
# Session model slugs go in .fstack/resolved.yaml, which is gitignored.
# Skills follow state/transitions.yaml. This file does not store resolved slugs.

version: "0.1"
state_version: 1

workspace: features

state:
  backend: git
  branch_prefix: fstack

# notify does not wait for plan approval. approve waits.
# The default is off.
plan_review: notify

review:
  mode: end_of_stack

# conversation means this chat. Any other value is an outward message
# and waits for approval of the exact text.
notify: conversation

roles:
  orchestrator:
    description: Runs the feature flow, plans the work, launches coding agents, and reports to the human.
    agent: orchestrator
    model: inherit
  verifier:
    description: Returns a structured verdict for one chunk. Does not write feature state.
    agent: verifier
    model: inherit
  implementer:
    description: Cursor coding agent. Implements one chunk and opens or updates a stacked pull request.
    agent: cursor-coding-agent
    model: inherit
    runtime: cloud

# Preference order is the list order. The first detected effort wins.
# opus is Claude Opus in Cursor. argon is Gemini Argon in Cursor.
models:
  opus:
    match: [claude-opus-5-5, claude-opus]
    effort: [xhigh, max, high, medium, low]
  argon:
    match: [gemini-4-argon, gemini-argon]
    effort: [high, medium, low]

advisors:
  planner_review:
    model: opus        # e.g. Claude Opus 5.5 in Cursor
    when: [gap-analysis, split-into-chunks]
  verify_tiebreak:
    model: argon       # Gemini 4 Argon in Cursor
    when: [verifier-disputed]
    fallback: [opus]
    must_differ_from: verifier
  max_calls_per_feature: 6
  reserve:
    verify_tiebreak: 2

# Fixed policy. setup-project stops if a value differs. The validator checks the same.
human_gates:
  merge: require_approval
  release: require_approval
  outward_messages: require_approval
  collect_requirements: manual_only

verify:
  max_failures_before_escalation: 2
  commands: []

release:
  # Quoted in the release question. Empty means an approved release merges the stack and stops.
  command: ""
