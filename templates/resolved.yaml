# Resolved models

On the Cursor plugin, setup-project writes this file to `.fstack/resolved.yaml`. It is gitignored. It holds resolved model slugs and Notion page and database ids. It is not a copy of feature state. Do not put the fstack repository URL or `applied_commit` here. On Grok Bot, keep the same notes in the bot's persistent state and do not create this file in the product repository. Do not commit it. Do not copy these values into `fstack.yaml`.

```yaml
resolved_at:
source:
plugin_version:
models:
  opus: inherit
  argon: inherit
roles:
  orchestrator: inherit
  verifier: inherit
  implementer: inherit
runtime: cloud
runtime_note:
fallbacks: {}
advisor_cli:
  - runtime: claude-cli
    command: claude
    model: opus
    enabled: true
    available: false
    signed_in: false
```

`inherit` means the parent Cursor model. `runtime` is `cloud` or `local_worktree`. `advisor_cli` records whether a configured local advisor command is on `PATH` and signed in. It stores no paths and no tokens.
