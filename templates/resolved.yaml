# Resolved models

setup-project writes this file to `/cursor/stores/self/fstack/resolved.yaml` when that store is mounted, and to `.fstack/resolved.yaml` otherwise. Do not commit it. Do not copy these values into `fstack.yaml`.

```yaml
resolved_at:
source:
plugin_version:
models:
  opus: inherit
  argon: inherit
roles:
  orchestrator: inherit
  verifier: inherit
  implementer: inherit
runtime: cloud
runtime_note:
fallbacks: {}
advisor_cli:
  - runtime: claude-cli
    command: claude
    model: opus
    enabled: true
    available: false
    signed_in: false
```

`inherit` means the parent Cursor model. `runtime` is `cloud` or `local_worktree`. `advisor_cli` records whether a configured local advisor command is on `PATH` and signed in. It stores no paths and no tokens.
