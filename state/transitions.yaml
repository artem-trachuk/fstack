coverage_fields:
  - item
  - repo
  - commit
  - node
  - presences
  - classification
  - next_action
  - decision
  - write_back
  - approved

graph_node_fields:
  - kind
  - status
  - evidence
  - provenance
  - last_verified

graph_edge_fields:
  - kind
  - from_node
  - to_node

survey_fields:
  - commit

decision_fields:
  - summary

verification_fields:
  - verdict

fix_fields:
  - expected
  - actual
  - reproduce
  - severity

debug_log_fields:
  - opened

# Every page type names the relations that keep it connected.
# product is the root and has no required outgoing relation.
# A page is reachable when a path of these relations leads to it from the product page.
required_relations:
  product: []
  feature: [Product, Chunks, Nodes read, Nodes added, Nodes changed]
  chunk: [Product, Feature, Touched nodes]
  graph_node: [Product]
  graph_edge: [Product, From, To]
  survey: [Product, Nodes]
  coverage: [Product, Feature]
  decision: [Product, Feature]
  verification: [Product, Chunk]
  fix: [Product, Feature]
  workflow: [Product]
  debug_log: [Product]

# Empty is allowed. fstack-status must not call these unlinked.
optional_relations:
  feature: [Nodes removed]
  chunk: [Depends on]
  coverage: [Node]
  survey: [Feature]
  fix: [Nodes, Chunks, Verification]
  workflow: [Feature]
  debug_log: [Previous]

workflow_fields:
  - scope
  - config_version
  - slot
  - skill
  - params
  - notes
  - skip
  - who
  - when
  - old
  - new

coverage_classifications:
  - done
  - partial
  - missing
  - needs_decision
  - conflict
  - undocumented

waiting_kinds:
  - questions
  - coverage_questions
  - source_write
  - coverage_approval
  - graph_promotion
  - plan
  - stack_review
  - release
  - escalation
  - verification_unimplemented
  - ci
  - release_command

prompt_page: prompt <action> a<attempt>
verdict_page: verification <chunk-id> a<attempt>
decision_log: Decision pages related to the feature
chunk_id: NN-slug
